name: deploy-workers

# Cloudflare Workers（currency-strength / lotsizing-alert / lotsizing-fund）を wrangler でデプロイする。
# - main への push: 変更のあった Worker だけ（各 Worker は ../../src/lib を共有するため、src/lib の変更は全 Worker が対象）
# - 手動実行（Actions → deploy-workers → Run workflow）: 選んだ Worker、または all
# 事前に Settings → Secrets and variables → Actions に CLOUDFLARE_API_TOKEN（Workers の編集権限）を登録すること。
# アカウントが複数あるトークンなら CLOUDFLARE_ACCOUNT_ID も登録する。
# Python の backend（lotsizing-elliott）は対象外（pywrangler が必要なため手動でデプロイする）。
on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "alert-worker/**"
      - "fund-worker/**"
      - "src/lib/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイする Worker"
        type: choice
        options: [all, worker, alert-worker, fund-worker]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false # デプロイの途中で打ち切らない

jobs:
  # どの Worker をデプロイするかを決める。
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          # currency-strength を先にデプロイする（lotsizing-alert が Service Binding で参照するため）。
          all='["worker","alert-worker","fund-worker"]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$TARGET" = "all" ]; then echo "targets=$all" >> "$GITHUB_OUTPUT"; else echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # push: 直前の main との差分で判定（取れなければ直前のコミットと比較）。
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE" 2>/dev/null || BEFORE="HEAD~1"
          fi
          changed="$(git diff --name-only "$BEFORE" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/lib/|\.github/workflows/deploy-workers\.yml$)'; then
            echo "targets=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          picked=()
          for w in worker alert-worker fund-worker; do
            echo "$changed" | grep -q "^$w/" && picked+=("\"$w\"")
          done
          echo "targets=[$(IFS=,; echo "${picked[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # 上の順（currency-strength が先）で1つずつ
      fail-fast: true
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secrets に CLOUDFLARE_API_TOKEN が登録されていません（Settings → Secrets and variables → Actions）"
            exit 1
          fi
      - name: Install
        working-directory: ${{ matrix.dir }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Deploy
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 未登録なら空のまま渡さない（トークンからアカウントを自動判定させる）。
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx wrangler deploy
