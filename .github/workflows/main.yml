name: deploy

# main への push で GitHub Pages（https://ozawakota.github.io/lotSizing-app/）へデプロイする。
# 事前に リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # リポジトリは pnpm（pnpm-lock.yaml）。Mobiscroll の取得には .npmrc の設定を使う。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Netlify（netlify.toml の NODE_VERSION）と同じ
          cache: pnpm
      # Worker の URL などの VITE_* は netlify.toml を唯一の定義元にし、ここで環境変数に読み込む。
      - name: Load VITE_* from netlify.toml
        run: |
          grep -E '^\s*VITE_[A-Z0-9_]+\s*=\s*"' netlify.toml \
            | sed -E 's/^\s*(VITE_[A-Z0-9_]+)\s*=\s*"(.*)"\s*$/\1=\2/' >> "$GITHUB_ENV"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        # GitHub Pages は https://USERNAME.github.io/REPOSITORY_NAME/ になるため、vite のベースパスを切り替える。
        env:
          GITHUB_PAGES: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # ブランチからの手動実行（動作確認）ではビルドまで行い、公開は main のときだけにする。
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
