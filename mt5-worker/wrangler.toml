# MT5 監視 worker 設定。
# 役割: Google 認証（許可メールのみ）で認可し、mt5-sync Turso(libSQL) を読んで
#       口座状態・建玉・直近約定を /state で返す（読み取り専用）。
# 認証検証は ../src/lib/googleVerify + ../src/lib/googleAuth を共有。
name = "lotsizing-mt5"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# フロントと同じ Google OAuth クライアントID（IDトークンの aud 検証に使用）。
GOOGLE_CLIENT_ID = "109768926010-pu509efgmds8k9vieq0t57h0ool573i6.apps.googleusercontent.com"
# 許可するメール（カンマ区切り）。
ALLOWED_EMAILS = "ozawa19890413@gmail.com"

# secret（`wrangler secret put <NAME>` で登録。ここには書かない）:
#   TURSO_DATABASE_URL … mt5-sync の URL（turso db show mt5-sync --url）
#   TURSO_AUTH_TOKEN   … turso db tokens create mt5-sync
