# 通貨強弱 Cloudflare Worker 設定
# 設計: ../docs/adr/0004-currency-strength-intraday-on-cloudflare-workers.md
name = "currency-strength"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 毎時0分に scheduled() を実行（直前の確定クロックアワーで再計算）
[triggers]
crons = ["0 * * * *"]

# KV ネームスペース（`wrangler kv namespace create STRENGTH_KV` で作成し id を貼る）
[[kv_namespaces]]
binding = "STRENGTH_KV"
id = "2bf5986d239e492ab68449b7df253ec4"

# 秘匿情報はここに書かず、`wrangler secret put TWELVE_DATA_API_KEY` で登録する:
#   TWELVE_DATA_API_KEY = <Twelve Data の APIキー>
