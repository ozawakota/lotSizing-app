<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant Warm Orange to Coral) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a3d" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Candlestick Body Gradient -->
    <linearGradient id="candleGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="candleGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.75" />
    </linearGradient>

    <!-- Arrow & Trend Line Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9a3412" flood-opacity="0.4" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Candlesticks Group -->
  <g filter="url(#shadow)">
    <!-- Candle 1 -->
    <line x1="160" y1="230" x2="160" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <rect x="146" y="255" width="28" height="75" rx="6" fill="url(#candleGrad1)" />

    <!-- Candle 2 -->
    <line x1="220" y1="180" x2="220" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <rect x="206" y="210" width="28" height="110" rx="6" fill="url(#candleGrad2)" />

    <!-- Candle 3 -->
    <line x1="280" y1="140" x2="280" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <rect x="266" y="175" width="28" height="145" rx="6" fill="url(#candleGrad1)" />

    <!-- Candle 4 -->
    <line x1="340" y1="110" x2="340" y2="350" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <rect x="326" y="145" width="28" height="175" rx="6" fill="url(#candleGrad2)" />
  </g>

  <!-- Dynamic Trend Curve and Arrow -->
  <g filter="url(#shadow)">
    <!-- Dynamic Growth Curve Path -->
    <path d="M 125 350 Q 180 340 215 285 T 310 210 L 375 145" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Arrow Head -->
    <path d="M 345 130 L 400 135 L 380 190 Z" 
          fill="url(#arrowGrad)" 
          stroke="url(#arrowGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>

  <!-- Calibration / Lot Scale Marks -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.65" filter="url(#subtleShadow)">
    <line x1="365" y1="215" x2="385" y2="210" />
    <line x1="355" y1="240" x2="375" y2="235" />
    <line x1="345" y1="265" x2="365" y2="260" />
    <line x1="335" y1="290" x2="355" y2="285" />
  </g>
</svg>